services:
  # Local-only host port publishing and dev-friendly defaults for a runnable app stack.
  # Use with: docker compose -f docker-compose.yaml -f docker-compose.local.yaml up -d

  app:
    build:
      args:
        VITE_BASE_URL: http://localhost:3000
        VITE_WEB_URL: http://localhost:3001
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      VITE_BASE_URL: http://localhost:3000
      VITE_WEB_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret-please-change}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1234567890abcdef1234567890abcdef}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://example.com/v1}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-dev-openai-compatible-key}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      GENERAL_MODEL: ${GENERAL_MODEL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_HOST: postgres
      POSTGRES_SSL: "false"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}

  web:
    ports:
      - "${WEB_PORT:-3001}:3001"

  workers:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379
      KREUZBERG_OCR_LANGUAGE: ${KREUZBERG_OCR_LANGUAGE:-eng+deu}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-https://example.com/v1}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-dev-openai-compatible-key}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      GENERAL_MODEL: ${GENERAL_MODEL}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}

  minio:
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  valkey:
    ports:
      - "${VALKEY_PORT:-6379}:6379"

  qdrant:
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"

  spicedb:
    ports:
      - "${SPICEDB_HTTP_PORT:-8080}:8080"
      - "${SPICEDB_METRICS_PORT:-9090}:9090"
      - "${SPICEDB_GRPC_PORT:-50051}:50051"

  spicedb-database:
    ports:
      - "${SPICEDB_POSTGRES_PORT:-5431}:5432"
