    - organization:org1#create_course@user:inst1
    - course:course1#manage@user:owner1
    - course:course1#manage@user:inst2
    - course:course1#read@user:anyone
    - course:course1#read@user:groupmember1
    - course:course1#read@user:student1
    - course:course1#manage_access@user:inst2
    - bot:bot1#read@user:student2
    - bot:bot1#edit@user:inst2
    - bot:bot1#manage_access@user:manager1
    - block:block1#read@user:student2
    - block:block1#edit@user:editor1
    - asset:asset1#download@user:student2
    - asset:asset1#fork@user:viewer1
    - bot:bot1#read@user:anyone
    - chat:chat1#read@user:student1
    - group:group1#manage@user:owner1

  assertFalse:
    - organization:org1#manage_members@user:inst1
    - course:course1#manage@user:student2
    - course:course1#manage_access@user:student2
    - bot:bot1#manage_access@user:editor1
    - block:block1#manage_access@user:student2
    - asset:asset1#edit@user:student2
    - chat:chat1#read@user:owner1
    - group:group1#manage@user:inst1
