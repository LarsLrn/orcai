name: sokratest-v2_devcontainer

x-dev-app-env: &dev_app_env
  BASE_URL: http://localhost:3000
  BETTER_AUTH_URL: http://localhost:3000
  VITE_BASE_URL: http://localhost:3000
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-better-auth-secret}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-1234567890abcdef1234567890abcdef}
  OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-http://localhost:11434/v1}
  OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-ollama}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
  GENERAL_MODEL: ${GENERAL_MODEL}
  VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
  VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}

x-dev-db-env: &dev_db_env
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-sokratest-v2}

x-dev-minio-env: &dev_minio_env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

x-dev-spicedb-env: &dev_spicedb_env
  SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
  SPICEDB_POSTGRES_USER: ${SPICEDB_POSTGRES_USER:-postgres}
  SPICEDB_POSTGRES_PASSWORD: ${SPICEDB_POSTGRES_PASSWORD:-postgres}

x-dev-qdrant-env: &dev_qdrant_env
  QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}

services:
  deps:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.workspace
    working_dir: /workspaces/sokratest-v2
    command: [ "bun", "install", "--frozen-lockfile" ]
    volumes:
      - .:/workspaces/sokratest-v2:cached
    user: bun
    restart: "no"

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.workspace
    working_dir: /workspaces/sokratest-v2
    command: [ "/bin/sh", "-c", "while sleep 1000; do :; done" ]
    volumes:
      - .:/workspaces/sokratest-v2:cached
    environment:
      <<: [ *dev_app_env, *dev_db_env, *dev_minio_env, *dev_spicedb_env, *dev_qdrant_env ]
      NODE_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333/
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-false}
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      spicedb-schema:
        condition: service_completed_successfully

  workers:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.workspace
    working_dir: /workspaces/sokratest-v2
    command: [ "/bin/sh", "-c", "bun run workers:dev" ]
    volumes:
      - .:/workspaces/sokratest-v2:cached
    environment:
      <<: [ *dev_app_env, *dev_db_env, *dev_minio_env, *dev_qdrant_env ]
      NODE_ENV: development
      KREUZBERG_OCR_LANGUAGE: ${KREUZBERG_OCR_LANGUAGE:-eng+deu}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333/
    user: bun
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy

  postgres:
    environment:
      <<: *dev_db_env

  migrations:
    environment:
      <<: *dev_db_env
      POSTGRES_HOST: postgres

  minio:
    environment:
      <<: *dev_minio_env

  minio-setup:
    environment:
      <<: *dev_minio_env

  spicedb-database:
    environment:
      POSTGRES_USER: ${SPICEDB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SPICEDB_POSTGRES_PASSWORD:-postgres}

  spicedb-migrate:
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb

  spicedb:
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb

  qdrant:
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key}

  valkey:
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"

  spicedb-schema:
    environment:
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_SECURITY: insecure-plaintext
