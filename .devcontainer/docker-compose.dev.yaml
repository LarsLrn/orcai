name: orcai_devcontainer

# Every value is literal: Compose interpolates from the checkout's `.env`,
# which belongs to the host stack.

x-dev-db-env: &dev_db_env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: app

x-dev-spicedb-datastore: &dev_spicedb_datastore postgres://postgres:postgres@spicedb-database:5432/spicedb

services:
  deps:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.workspace
    working_dir: /workspaces/orcai
    command: [ "bun", "install", "--frozen-lockfile", "--ignore-scripts" ]
    volumes:
      - .:/workspaces/orcai:cached
    environment:
      BUN_OPTIONS: --no-env-file
    user: bun
    restart: "no"

  workspace:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile.workspace
    working_dir: /workspaces/orcai
    command: [ "/bin/sh", "-c", "while sleep 1000; do :; done" ]
    volumes:
      - .:/workspaces/orcai:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *dev_db_env
      BUN_OPTIONS: --no-env-file
      ORCAI_ENV_FILE: .devcontainer/.env
      NODE_ENV: development
      BASE_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      VITE_BASE_URL: http://localhost:3000
      VITE_WEB_URL: http://localhost:3001
      KREUZBERG_OCR_LANGUAGE: eng+deu
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SSL: "false"
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_REGION: eu-central-1
      S3_ACCESS_KEY: s3admin
      S3_SECRET_KEY: s3admin-secret
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: dev-qdrant-key
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: dev-spicedb-token
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      spicedb-schema:
        condition: service_completed_successfully

  postgres:
    environment:
      <<: *dev_db_env

  migrations:
    environment:
      <<: *dev_db_env
      POSTGRES_HOST: postgres

  seaweedfs:
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin-secret

  qdrant:
    environment:
      QDRANT__SERVICE__API_KEY: dev-qdrant-key

  spicedb-database:
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d spicedb" ]

  spicedb-migrate:
    environment:
      SPICEDB_DATASTORE_CONN_URI: *dev_spicedb_datastore

  spicedb:
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: dev-spicedb-token
      SPICEDB_DATASTORE_CONN_URI: *dev_spicedb_datastore

  spicedb-schema:
    environment:
      SPICEDB_TOKEN: dev-spicedb-token
