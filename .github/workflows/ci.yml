name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run ci
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Pull requests whose changes are all docs content or Markdown outside
      # the runtime packages skip e2e; everything else runs it.
      - name: Decide whether e2e runs
        id: filter
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo e2e=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runtime=$(git diff --name-only --no-renames HEAD^1 HEAD | awk '
            !/^apps\/web\/content\// && !/^LICENSE$/ &&
            !(/\.md$/ && !/^(apps\/(app|workers)|packages)\//)')
          echo "e2e=$([ -n "$runtime" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # The production images every shard runs, built once with the Compose
  # build definitions. They carry no stack values, so each shard writes its own.
  images:
    name: e2e images
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Lets bake read and write the GitHub Actions cache.
      - name: Expose the Actions runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Write stack environment
        run: bun run stack env > /dev/null

      - name: Build images
        run: >-
          bun run stack build --
          --set app.cache-from=type=gha,scope=app
          --set app.cache-to=type=gha,scope=app,mode=max
          --set web.cache-from=type=gha,scope=web
          --set web.cache-to=type=gha,scope=web,mode=max
          --set workers.cache-from=type=gha,scope=workers
          --set workers.cache-to=type=gha,scope=workers,mode=max

      - name: Export images
        shell: bash
        run: |
          stack=$(sed -n 's/^ORCAI_STACK_NAME=//p' .env)
          mkdir -p "$RUNNER_TEMP/e2e-images"
          docker save "$stack-app" "$stack-web" "$stack-workers" \
            | zstd -T0 -3 > "$RUNNER_TEMP/e2e-images/images.tar.zst"

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images
          compression-level: 0
          retention-days: 1

  e2e-shard:
    name: e2e ${{ matrix.shard }}
    needs: [changes, images]
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The integration tier runs once, on shard 1. Only the pipeline job
        # runs the background workers.
        include:
          - shard: 1/3
            args: -- --shard=1/3
          - shard: 2/3
            args: --no-integration -- --shard=2/3
          - shard: 3/3
            args: --no-integration -- --shard=3/3
          - shard: pipeline
            args: --pipeline --no-integration
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: e2e-images
          path: ${{ runner.temp }}/e2e-images

      - name: Load images
        shell: bash
        run: zstd -dc "$RUNNER_TEMP/e2e-images/images.tar.zst" | docker load

      - name: Install Chromium
        working-directory: apps/e2e
        run: bunx --no-install playwright install --with-deps chromium

      - name: Start stack
        run: bun run stack up

      - name: Run end-to-end tests
        run: bun run stack e2e --yes --no-build ${{ matrix.args }}
        env:
          CI: true
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

  # The required check: passes when every shard passed or e2e was skipped.
  e2e:
    needs: [changes, images, e2e-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check shard results
        run: |
          [ "${{ needs.changes.result }}" = success ]
          [[ "${{ needs.images.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.e2e-shard.result }}" =~ ^(success|skipped)$ ]]
