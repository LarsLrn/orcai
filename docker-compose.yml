services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg17
    container_name: sokratest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
    restart: on-failure
    command: [ "/bin/sh", "-c", "./node_modules/.bin/drizzle-kit migrate --config=drizzle.config.ts" ]

  # MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: sokratest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000" # API
      - "9003:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sokratest-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: [ "CMD-SHELL", "grep -qE ':[0]*18BD\\s' /proc/net/tcp /proc/net/tcp6 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Your Sokratest Application
  sokratest:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.sokratest
      target: runtime
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3000}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    container_name: sokratest-app
    env_file:
      - .env
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
      POSTGRES_HOST: postgres
      POSTGRES_SSL: "false"

      # S3/MinIO Configuration
      S3_ENDPOINT: "http://minio:9000"
      S3_PORT: 9002
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: false

      # Qdrant Configuration
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Application Configuration
      BASE_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      VITE_BASE_URL: ${VITE_BASE_URL:-http://localhost:3000}

      # Secrets (from environment)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}

      # Email Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      # AI Services
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY}

      # Spice DB
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-key}

      # LLM Observability
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_BASEURL: ${LANGFUSE_BASEURL}

      # Analytics
      VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID}

      # Open Telemetry
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
      OTEL_NODE_RESOURCE_DETECTORS: ${OTEL_NODE_RESOURCE_DETECTORS}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      spicedb:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
      spicedb-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  # Create MinIO buckets once on startup
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin &&
      /usr/bin/mc mb myminio/documents --ignore-existing &&
      /usr/bin/mc mb myminio/uploads --ignore-existing &&
      /usr/bin/mc mb myminio/avatars --ignore-existing &&
      /usr/bin/mc anonymous set download myminio/avatars &&
      echo 'MinIO buckets created successfully'
      "
    restart: "no"

  spicedb:
    image: "authzed/spicedb:latest"
    command: "serve"
    restart: "always"
    ports:
      - "8080:8080"
      - "9090:9090"
      - "50051:50051"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-key}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    healthcheck:
      test: [ "CMD", "spicedb", "datastore", "head" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      spicedb-migrate:
        condition: service_completed_successfully

  spicedb-migrate:
    image: "authzed/spicedb:latest"
    command: "migrate head"
    restart: "on-failure"
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    depends_on:
      spicedb-database:
        condition: service_healthy

  spicedb-schema:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.spicedb-schema
    environment:
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-key}
      SPICEDB_SECURITY: insecure-plaintext
    command: [ "bun", "run", "scripts/deploy-spicedb-schema.ts" ]
    depends_on:
      spicedb:
        condition: service_healthy
    restart: on-failure

  spicedb-database:
    image: "postgres:17"
    ports:
      - "5431:5432"
    volumes:
      - spicedb_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SPICEDB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SPICEDB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: spicedb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPICEDB_POSTGRES_USER:-postgres} -d spicedb" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local
  spicedb_postgres_data:
    driver: local

networks:
  default:
    name: sokratest-network
