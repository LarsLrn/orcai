services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sokratest-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
    restart: on-failure
    command: [ "/bin/sh", "-c", "npx drizzle-kit migrate --config=drizzle.config.ts" ]

  # MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: sokratest-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000" # API
      - "9003:9001" # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sokratest-qdrant
    ports:
      - "6333:6333" # HTTP API
      - "6334:6334" # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    restart: unless-stopped

  # Your Sokratest Application
  sokratest:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.sokratest
      target: runtime
    container_name: sokratest-app
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sokratest-v2
      POSTGRES_HOST: postgres
      POSTGRES_SSL: "false"

      # S3/MinIO Configuration
      S3_ENDPOINT: "minio"
      S3_PORT: 9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_USE_SSL: false

      # Qdrant Configuration
      QDRANT_URL: http://qdrant:6333/

      # Application Configuration
      BETTER_AUTH_URL: "http://localhost:3000"
      VITE_BASE_URL: "http://localhost:3000"
      NODE_ENV: production
      PORT: 3000

      # Default secrets (change in production!)
      BETTER_AUTH_SECRET: "your_development_secret_key_change_in_production"
      ENCRYPTION_KEY: "your_32_char_dev_encryption_key!!"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  default:
    name: sokratest-network
