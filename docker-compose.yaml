services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Valkey cache
  valkey:
    image: valkey/valkey:9-alpine
    command: [ "valkey-server", "--appendonly", "yes" ]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli ping || redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
    restart: on-failure:5

  # SeaweedFS S3-Compatible Object Storage
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    command: mini -dir=/data -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0 -master.telemetry=false
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3admin-secret}
      S3_BUCKET: uploads,processed-files
    expose:
      - "8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    expose:
      - "6333"
    healthcheck:
      test: [ "CMD-SHELL", "grep -qE ':[0]*18BD\\s' /proc/net/tcp /proc/net/tcp6 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # OrcAI application (legacy service name retained)
  app:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.app
      target: runtime
    expose:
      - "3000"
    environment:
      # Database Configuration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: app
      POSTGRES_HOST: postgres
      POSTGRES_SSL: "false"
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      VALKEY_URL: redis://valkey:6379

      # S3 Configuration
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3admin-secret}

      # Qdrant Configuration
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Application Configuration
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      WEB_URL: ${WEB_URL:-}
      WEB_INTERNAL_URL: ${WEB_INTERNAL_URL:-http://web:3001}
      TWO_FACTOR_REQUIRED: ${TWO_FACTOR_REQUIRED:-none}

      # Secrets (from environment)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # AI Services
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}

      # Spice DB
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-}

      # Analytics
      UMAMI_SCRIPT_URL: ${UMAMI_SCRIPT_URL:-}
      UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID:-}

      # Feedback address named on the last card of the tour
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}

      # Open Telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
      spicedb-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  # OrcAI documentation website
  web:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.web
      target: runtime
    expose:
      - "3001"
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:3001').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # Background workers
  workers:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.workers
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_HOST: postgres
      POSTGRES_POOL_MAX: ${POSTGRES_POOL_MAX:-10}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-s3admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-s3admin-secret}
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OrcAI Team}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      KREUZBERG_OCR_LANGUAGE: ${KREUZBERG_OCR_LANGUAGE:-eng+deu}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  spicedb:
    image: "authzed/spicedb:v1.57.0"
    command: "serve"
    restart: unless-stopped
    expose:
      - "8080"
      - "9090"
      - "50051"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_SKIP_RELEASE_CHECK: "true"
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    healthcheck:
      test: [ "CMD", "spicedb", "datastore", "head" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      spicedb-database:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully

  spicedb-migrate:
    image: "authzed/spicedb:v1.57.0"
    command: "migrate head"
    restart: on-failure:5
    environment:
      SPICEDB_SKIP_RELEASE_CHECK: "true"
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    depends_on:
      spicedb-database:
        condition: service_healthy

  spicedb-schema:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.spicedb-schema
    environment:
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_SECURITY: insecure-plaintext
    depends_on:
      spicedb:
        condition: service_healthy
    restart: on-failure:5

  spicedb-database:
    image: "postgres:17.11"
    volumes:
      - spicedb_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SPICEDB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SPICEDB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: spicedb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPICEDB_POSTGRES_USER:-postgres} -d spicedb" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  seaweedfs_data:
    driver: local
  qdrant_data:
    driver: local
  spicedb_postgres_data:
    driver: local
