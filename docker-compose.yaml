services:
  # PostgreSQL Database
  postgres:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sokratest-v2
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Valkey cache
  valkey:
    image: valkey/valkey:9-alpine
    command: [ "valkey-server", "--appendonly", "yes" ]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "valkey-cli ping || redis-cli ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Database Migrations
  migrations:
    build:
      context: .
      dockerfile: docker/Dockerfile.migrations
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sokratest-v2
    restart: on-failure

  # MinIO S3-Compatible Object Storage
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.18.0
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    expose:
      - "6333"
    healthcheck:
      test: [ "CMD-SHELL", "grep -qE ':[0]*18BD\\s' /proc/net/tcp /proc/net/tcp6 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # OrcAI application (legacy service name retained)
  sokratest:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.sokratest
      target: runtime
      args:
        VITE_BASE_URL: ${VITE_BASE_URL:-}
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    expose:
      - "3000"
    environment:
      # Database Configuration
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sokratest-v2
      POSTGRES_HOST: postgres
      POSTGRES_SSL: "false"
      VALKEY_URL: redis://valkey:6379

      # S3/MinIO Configuration
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

      # Qdrant Configuration
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Application Configuration
      BASE_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      VITE_BASE_URL: ${VITE_BASE_URL:-}

      # Secrets (from environment)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}

      # AI Services
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      GENERAL_MODEL: ${GENERAL_MODEL}

      # Spice DB
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-}

      # Analytics
      VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
      VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}

      # Open Telemetry
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    healthcheck:
      test: [ "CMD", "bun", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      spicedb:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully
      spicedb-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  # Background workers
  workers:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.workers
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sokratest-v2}
      POSTGRES_HOST: postgres
      VALKEY_URL: redis://valkey:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      QDRANT_URL: http://qdrant:6333/
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-OrcAI Team}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      KREUZBERG_OCR_LANGUAGE: ${KREUZBERG_OCR_LANGUAGE:-eng+deu}
      OPENAI_COMPATIBLE_BASE_URL: ${OPENAI_COMPATIBLE_BASE_URL:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS}
      GENERAL_MODEL: ${GENERAL_MODEL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    restart: unless-stopped

  # Create MinIO buckets once on startup
  minio-setup:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c " /usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && /usr/bin/mc mb myminio/sokratest --ignore-existing && /usr/bin/mc mb myminio/processed-files --ignore-existing && /usr/bin/mc mb myminio/sokratest-dev --ignore-existing && /usr/bin/mc mb myminio/processed-files-dev --ignore-existing && echo 'MinIO buckets created successfully' "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    restart: "no"

  spicedb:
    image: "authzed/spicedb:v1.51.0"
    command: "serve"
    restart: "always"
    expose:
      - "8080"
      - "9090"
      - "50051"
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    healthcheck:
      test: [ "CMD", "spicedb", "datastore", "head" ]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      spicedb-database:
        condition: service_healthy
      spicedb-migrate:
        condition: service_completed_successfully

  spicedb-migrate:
    image: "authzed/spicedb:v1.51.0"
    command: "migrate head"
    restart: "on-failure"
    environment:
      SPICEDB_DATASTORE_ENGINE: postgres
      SPICEDB_DATASTORE_CONN_URI: postgres://${SPICEDB_POSTGRES_USER:-postgres}:${SPICEDB_POSTGRES_PASSWORD:-postgres}@spicedb-database:5432/spicedb
    depends_on:
      spicedb-database:
        condition: service_healthy

  spicedb-schema:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.spicedb-schema
    environment:
      SPICEDB_ENDPOINT: spicedb:50051
      SPICEDB_TOKEN: ${SPICEDB_GRPC_PRESHARED_KEY:-dev-spicedb-token}
      SPICEDB_SECURITY: insecure-plaintext
    depends_on:
      spicedb:
        condition: service_healthy
    restart: on-failure

  spicedb-database:
    image: "postgres:17.10"
    volumes:
      - spicedb_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SPICEDB_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${SPICEDB_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: spicedb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPICEDB_POSTGRES_USER:-postgres} -d spicedb" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
    driver: local
  valkey_data:
    driver: local
  minio_data:
    driver: local
  qdrant_data:
    driver: local
  spicedb_postgres_data:
    driver: local
