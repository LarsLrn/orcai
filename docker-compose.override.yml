# Production testing override
# This file only includes essential services for testing production behavior

services:
  # Create MinIO buckets on startup
  minio-setup:
    image: minio/mc:latest
    container_name: sokratest-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c " sleep 10; /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin; /usr/bin/mc mb myminio/documents --ignore-existing; /usr/bin/mc mb myminio/uploads --ignore-existing; /usr/bin/mc mb myminio/avatars --ignore-existing; /usr/bin/mc policy set public myminio/avatars; echo 'MinIO buckets created successfully'; exit 0; "
